<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังข้อสอบ POL1101 บทที่ 2 - หลักประชาธิปไตย</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        header h1 {
            color: #1e3c72;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        header h2 {
            color: #555;
            font-size: 1rem;
            font-weight: 400;
        }

        .quiz-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .progress-bar {
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            background: #eef2f7;
            border-color: #cbd5e1;
        }

        .option-item.selected {
            background-color: #e2e8f0;
            border-color: #1e3c72;
            color: #1e3c72;
            font-weight: bold;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            background-color: #1e3c72;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2a5298;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-submit {
            background-color: #198754;
        }

        .btn-submit:hover {
            background-color: #146c43;
        }

        .btn-restart {
            background-color: #0b5ed7;
            margin-top: 15px;
        }

        .hidden {
            display: none !important;
        }

        /* หน้าสรุปผล */
        .score-summary {
            text-align: center;
            padding: 10px 0 20px;
        }

        .score-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e3c72;
            margin: 10px 0;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #e0e0e0;
            margin: 20px 0;
        }

        .review-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .review-question {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .user-answer-box {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .text-correct {
            color: #198754;
            font-weight: bold;
        }

        .text-wrong {
            color: #dc3545;
            font-weight: bold;
        }

        .explanation-list {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .explanation-list div {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>คลังข้อสอบ POL1101 บทที่ 2</h1>
            <h2>เรื่อง: หลักประชาธิปไตย</h2>
        </header>

        <main id="quiz-container">
            <!-- หน้าทำข้อสอบ -->
            <div id="question-box" class="quiz-card">
                <div class="progress-bar">
                    <span id="progress-text">ข้อที่ 1 / 10</span>
                </div>
                <h3 id="question-text" class="question-title">กำลังโหลดข้อสอบ...</h3>
                <ul id="options-list" class="options-list"></ul>
                <div class="actions">
                    <button id="prev-btn" class="btn btn-secondary hidden" onclick="prevQuestion()">⇽ ข้อย้อนหลัง</button>
                    <div></div>
                    <button id="next-btn" class="btn" onclick="nextQuestion()">ข้อถัดไป ➔</button>
                    <button id="submit-btn" class="btn btn-submit hidden" onclick="submitQuiz()">ส่งข้อสอบ 🏁</button>
                </div>
            </div>

            <!-- หน้าแสดงผลและเฉลย -->
            <div id="result-box" class="quiz-card hidden">
                <div class="score-summary">
                    <h2>🎉 ทำข้อสอบเสร็จสิ้น!</h2>
                    <p class="score-text">คะแนนของคุณ: <span id="final-score">0</span> / <span id="max-score">10</span></p>
                    <button class="btn btn-restart" onclick="restartQuiz()">🔄 ทำแบบทดสอบอีกครั้ง</button>
                </div>
                <hr class="divider">
                <h3>📌 เฉลยรายละเอียดทุกข้อ</h3>
                <div id="explanations-container"></div>
            </div>
        </main>
    </div>

    <script>
        const quizData = [
            {
                id: 1,
                question: "1. การปกครองระบอบประชาธิปไตยเกิดขึ้นครั้งแรก ณ บริเวณใด และมีลักษณะการปกครองแบบใด?",
                options: [
                    "ก. นครรัฐสปาร์ตา – ประชาธิปไตยโดยอ้อม",
                    "ข. นครรัฐกรีกโบราณ – ประชาธิปไตยโดยตรง",
                    "ค. กรุงโรมโบราณ – ประชาธิปไตยแบบผู้แทน",
                    "ง. ประเทศอังกฤษ – ประชาธิปไตยแบบรัฐสภา"
                ],
                correct: 1,
                explanations: [
                    "ก. ผิด เพราะนครรัฐสปาร์ตาไม่ได้ใช้ระบอบประชาธิปไตย",
                    "ข. ถูกต้อง เพราะเริ่มขึ้นครั้งแรกบริเวณหุบเขากรีกโบราณ เป็นประชาธิปไตยโดยตรงเนื่องจากอาณาเขตและประชากรยังน้อย",
                    "ค. ผิด เพราะกรุงโรมโดดเด่นเรื่องระบอบสาธารณรัฐและกฎหมาย",
                    "ง. ผิด เพราะอังกฤษเป็นต้นแบบประชาธิปไตยแบบผู้แทนยุคใหม่"
                ]
            },
            {
                id: 2,
                question: "2. สิทธิเสรีภาพประเภทใดที่มีค่าสูงมาก หากอนุญาตให้แสดงออกอย่างเสรีแล้ว เชื่อว่าจะช่วยป้องกันไม่ให้เกิดความขัดแย้งอย่างรุนแรง?",
                options: [
                    "ก. เสรีภาพในการประกอบอาชีพ",
                    "ข. เสรีภาพในการนับถือศาสนา",
                    "ค. เสรีภาพในการพูด การพิมพ์ และการโฆษณา",
                    "ง. สิทธิในทรัพย์สิน"
                ],
                correct: 2,
                explanations: [
                    "ก. ผิด เป็นสิทธิส่วนบุคคลเกี่ยวกับการดำรงชีวิต",
                    "ข. ผิด เป็นเรื่องความศรัทธาส่วนบุคคล",
                    "ค. ถูกต้อง เพราะเอกสารระบุว่าหากยอมให้ทุกฝ่ายได้แสดงความคิดเห็นอย่างเสรี การขัดแย้งกันอย่างรุนแรงจะไม่เกิดขึ้น",
                    "ง. ผิด เป็นสิทธิที่รัฐต้องคุ้มครองทรัพย์สินของประชาชน"
                ]
            },
            {
                id: 3,
                question: "3. การจัดตั้ง 'มหาวิทยาลัยรามคำแหง' เป็นตัวอย่างของการสร้างความเสมอภาคในด้านใด?",
                options: [
                    "ก. ความเสมอภาคทางการเมือง",
                    "ข. ความเสมอภาคต่อการปฏิบัติของกฎหมาย",
                    "ค. ความเสมอภาคในโอกาส",
                    "ง. ความเสมอภาคทางสังคม"
                ],
                correct: 2,
                explanations: [
                    "ก. ผิด เน้นเรื่องสิทธิทางการเมืองอย่างการเลือกตั้ง",
                    "ข. ผิด เน้นการห้ามใช้มาตรฐานสองมาตรฐาน (Double Standard)",
                    "ค. ถูกต้อง เพราะการมีมหาวิทยาลัยรามคำแหงเปิดโอกาสให้ทุกคนได้รับการศึกษาเพื่อเลื่อนฐานะทางสังคมอย่างเท่าเทียม",
                    "ง. ผิด เน้นเรื่องการเคารพศักดิ์ศรีความเป็นมนุษย์เท่ากัน"
                ]
            },
            {
                id: 4,
                question: "4. ตามวาทะของ อับราฮัม ลินคอล์น คำว่า 'รัฐบาลโดยประชาชน' (Government by the people) มีความหมายตรงกับข้อใด?",
                options: [
                    "ก. ประชาชนอยู่ในฐานะเป็นเจ้าของรัฐบาลและเจ้าของอำนาจอธิปไตย",
                    "ข. ประชาชนทุกคนมีสิทธิที่จะเป็นผู้ปกครองได้ หากได้รับเสียงสนับสนุนจากประชาชนส่วนใหญ่",
                    "ค. รัฐบาลจะต้องมีจุดประสงค์เพื่อความผาสุกหรือบำบัดทุกข์บำรุงสุขให้กับประชาชน",
                    "ง. รัฐบาลจะต้องมีการกำหนดวาระในการดำรงตำแหน่ง"
                ],
                correct: 1,
                explanations: [
                    "ก. ผิด ข้อนี้เป็นความหมายของ 'รัฐบาลของประชาชน' (Of the people)",
                    "ข. ถูกต้อง เพราะ 'รัฐบาลโดยประชาชน' หมายถึงพลเมืองทุกคนมีสิทธิเป็นผู้ปกครองได้โดยไม่ถูกจำกัดไว้เฉพาะชนชั้นใดชนชั้นหนึ่ง",
                    "ค. ผิด ข้อนี้เป็นความหมายของ 'รัฐบาลเพื่อประชาชน' (For the people)",
                    "ง. ผิด เป็นเพียงกลไกประกันการปกครองเพื่อประชาชน"
                ]
            },
            {
                id: 5,
                question: "5. ในระบอบประชาธิปไตย การใช้เสียงข้างมากโดยละเมิดหรือก้าวก่ายสิทธิขั้นพื้นฐานของเสียงข้างน้อย ถือเป็นการกระทำตามข้อใด?",
                options: [
                    "ก. การปกครองโดยกฎหมาย (Rule by Law)",
                    "ข. การใช้ 'กฎหมู่'",
                    "ค. การประนีประนอมทางการเมือง",
                    "ง. การยึดหลักเหตุผลนิยม"
                ],
                correct: 1,
                explanations: [
                    "ก. ผิด เพราะการละเมิดสิทธิผู้อื่นขัดกับหลักกฎหมายประชาธิปไตย",
                    "ข. ถูกต้อง เพราะเอกสารระบุชัดเจนว่า หากเสียงข้างมากละเมิดสิทธิของเสียงข้างน้อย ถือเป็นการใช้ 'กฎหมู่'",
                    "ค. ผิด การประนีประนอมคือการหลีกเลี่ยงความรุนแรงและรับฟังกัน",
                    "ง. ผิด หลักเหตุผลนิยมต้องเคารพสิทธิของผู้อื่นด้วย"
                ]
            },
            {
                id: 6,
                question: "6. ค่านิยมและทัศนคติในข้อใดที่เป็นอุปสรรคต่อระบอบประชาธิปไตยในสังคมไทย ซึ่งเป็นผลมาจากการยึดตัวบุคคลมากกว่าหลักการ?",
                options: [
                    "ก. ระบบอุปถัมภ์ (Patronage System)",
                    "ข. การลงคะแนนแบบลับ (Secret Ballot)",
                    "ค. หลักเหตุผลนิยม (Rationalism)",
                    "ง. ความสำนึกรับผิดชอบต่อสังคมส่วนรวม (Public Spirit)"
                ],
                correct: 0,
                explanations: [
                    "ก. ถูกต้อง เพราะระบบอุปถัมภ์เกิดจากการยึดตัวบุคคลมากกว่าหลักการ ซึ่งเป็นอุปสรรคต่อประชาธิปไตย",
                    "ข. ผิด เป็นหลักประกันเสรีภาพในการเลือกตั้ง",
                    "ค. ผิด เป็นหลักการที่ส่งเสริมประชาธิปไตย",
                    "ง. ผิด เป็นวิถีชีวิตประชาธิปไตยที่พึงประสงค์"
                ]
            },
            {
                id: 7,
                question: "7. บุคคลที่มี 'วิถีชีวิตแบบประชาธิปไตย' ในเรื่องความเคารพกฎหมาย ควรปฏิบัติตนอย่างไรเมื่อรู้สึกว่ากฎหมายที่ใช้อยู่ไม่เป็นธรรม?",
                options: [
                    "ก. ใช้วิธีฝ่าฝืนกฎหมายนั้นทันที",
                    "ข. ไม่ยอมรับและใช้กำลังคัดค้าน",
                    "ค. หาทางเรียกร้องให้มีการแก้ไขกฎหมายนั้น",
                    "ง. นิ่งเฉยและปล่อยให้ผู้อื่นฝ่าฝืนตามอำเภอใจ"
                ],
                correct: 2,
                explanations: [
                    "ก. ผิด การฝ่าฝืนขัดกับวิถีชีวิตประชาธิปไตย",
                    "ข. ผิด การใช้กำลังขัดกับหลักสันติวิธี",
                    "ค. ถูกต้อง เอกสารระบุว่าหากเห็นว่ากฎหมายไม่เป็นธรรม ต้องหาทางเรียกร้องให้มีการแก้ไข มิใช่ฝ่าฝืนหรือไม่ยอมรับ",
                    "ง. ผิด การปล่อยปละละเลยไม่ใช่ลักษณะของพลเมืองที่ดี"
                ]
            },
            {
                id: 8,
                question: "8. ข้อความ 'A hungry man is not a freeman' ถูกนำมาใช้อธิบายเพื่อเน้นย้ำความสำคัญของความเสมอภาคในด้านใด?",
                options: [
                    "ก. ความเสมอภาคทางการเมือง",
                    "ข. ความเสมอภาคต่อการปฏิบัติของกฎหมาย",
                    "ค. ความเสมอภาคทางเศรษฐกิจ",
                    "ง. ความเสมอภาคทางสังคม"
                ],
                correct: 2,
                explanations: [
                    "ก. ผิด เน้นเรื่องสิทธิเลือกตั้งและการมีส่วนร่วมทางการเมือง",
                    "ข. ผิด เน้นการปฏิบัติอย่างเท่าเทียมตามกฎหมาย",
                    "ค. ถูกต้อง เพราะคนที่กังวลเรื่องปากท้องจะขาดความสนใจความเป็นไปของบ้านเมือง รัฐจึงต้องสร้างความมั่นคงทางเศรษฐกิจพอสมควร",
                    "ง. ผิด เน้นเรื่องศักดิ์ศรีความเป็นมนุษย์"
                ]
            },
            {
                id: 9,
                question: "9. ตามบทบัญญัติแห่งรัฐธรรมนูญเกี่ยวกับสิทธิเสรีภาพของประชาชน (มาตรา 39) การกระทำในข้อใดที่รัฐ **มิอาจกระทำได้**?",
                options: [
                    "ก. การจับกุมบุคคลเมื่อมีคำสั่งหรือหมายของศาล",
                    "ข. การคุมขังบุคคลเมื่อมีคำสั่งหรือหมายของศาล",
                    "ค. การเนรเทศบุคคลสัญชาติไทยออกนอกราชอาณาจักร",
                    "ง. การจำกัดเสรีภาพในการแสดงความคิดเห็นที่หมิ่นประมาทบุคคลอื่น"
                ],
                correct: 2,
                explanations: [
                    "ก. ผิด รัฐทำได้ตามกฎหมายหากมีหมายศาล",
                    "ข. ผิด รัฐทำได้ตามคำสั่งศาล",
                    "ค. ถูกต้อง ตามมาตรา 39 การเนรเทศผู้มีสัญชาติไทยออกนอกราชอาณาจักร หรือห้ามผู้มีสัญชาติไทยเข้าประเทศ จะกระทำมิได้",
                    "ง. ผิด รัฐสามารถจำกัดเสรีภาพได้หากไปหมิ่นประมาทหรือละเมิดสิทธิผู้อื่น"
                ]
            },
            {
                id: 10,
                question: "10. ข้อใดคือความหมายของ 'หลักเหตุผลนิยม' (Rationalism) ในวิถีชีวิตประชาธิปไตย?",
                options: [
                    "ก. การยึดมั่นในตัวบุคคลและเคร่งครัดเรื่องระบบอาวุโส",
                    "ข. การศรัทธาบุคคลใดบุคคลหนึ่งถึงขั้นปูชนียบุคคล",
                    "ค. การยอมรับว่ามนุษย์ทุกคนต่างก็มีเหตุผล และรับฟังความคิดเห็นเพื่อค้นหาความถูกต้อง",
                    "ง. การดึงดันยึดมั่นแต่ความคิดเห็นของตนเองโดยไม่ยอมผ่อนปรน"
                ],
                correct: 2,
                explanations: [
                    "ก. ผิด เป็นอุปสรรคต่อประชาธิปไตย",
                    "ข. ผิด การยึดตัวบุคคลขัดกับหลักเหตุผลนิยม",
                    "ค. ถูกต้อง เพราะเชื่อว่าทุกคนมีเหตุผล ประชาธิปไตยดำเนินไปได้ด้วยการเปิดใจรับฟังเพื่อค้นหาข้อเท็จจริงและความถูกต้อง",
                    "ง. ผิด การไม่ยอมรับฟังผู้อื่นขัดกับหลักประชาธิปไตย"
                ]
            }
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function loadQuestion() {
            const qData = quizData[currentQuestion];
            
            document.getElementById('progress-text').innerText = `ข้อที่ ${currentQuestion + 1} / ${quizData.length}`;
            document.getElementById('question-text').innerText = qData.question;
            
            const optionsContainer = document.getElementById('options-list');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                if (userAnswers[currentQuestion] === index) {
                    li.classList.add('selected');
                }
                li.innerText = opt;
                li.onclick = () => selectOption(index);
                optionsContainer.appendChild(li);
            });

            // ปุ่มย้อนกลับ
            if (currentQuestion > 0) {
                document.getElementById('prev-btn').classList.remove('hidden');
            } else {
                document.getElementById('prev-btn').classList.add('hidden');
            }

            // ปุ่มข้อถัดไป / ปุ่มส่ง
            if (currentQuestion === quizData.length - 1) {
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
            }
        }

        function selectOption(index) {
            userAnswers[currentQuestion] = index;
            loadQuestion();
        }

        function nextQuestion() {
            if (userAnswers[currentQuestion] === null) {
                alert("กรุณาเลือกคำตอบก่อนไปข้อถัดไปครับ");
                return;
            }
            currentQuestion++;
            loadQuestion();
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function submitQuiz() {
            // เช็คว่าทำครบทุกข้อหรือยัง
            const unanswered = userAnswers.map((ans, idx) => ans === null ? idx + 1 : null).filter(val => val !== null);
            
            if (unanswered.length > 0) {
                alert(`กรุณาตอบคำตอบให้ครบทุกข้อก่อนส่งข้อสอบครับ\nข้อที่ยังไม่ได้ตอบ: ${unanswered.join(', ')}`);
                return;
            }

            let score = 0;
            quizData.forEach((q, index) => {
                if (userAnswers[index] === q.correct) {
                    score++;
                }
            });

            document.getElementById('question-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');

            document.getElementById('final-score').innerText = score;
            document.getElementById('max-score').innerText = quizData.length;

            showExplanations();
        }

        function showExplanations() {
            const expContainer = document.getElementById('explanations-container');
            expContainer.innerHTML = '';

            quizData.forEach((q, index) => {
                const userAns = userAnswers[index];
                const isCorrect = userAns === q.correct;

                const reviewDiv = document.createElement('div');
                reviewDiv.className = 'review-item';

                let expItemsHTML = '';
                q.explanations.forEach(exp => {
                    expItemsHTML += `<div>• ${exp}</div>`;
                });

                reviewDiv.innerHTML = `
                    <div class="review-question">${q.question}</div>
                    <div class="user-answer-box">
                        คำตอบของคุณ: 
                        <span class="${isCorrect ? 'text-correct' : 'text-wrong'}">
                            ${userAns !== null ? q.options[userAns] : 'ไม่ได้ตอบ'} 
                            ${isCorrect ? '✓ (ถูกต้อง)' : '✗ (ผิด)'}
                        </span>
                    </div>
                    ${!isCorrect ? `<div class="user-answer-box text-correct">คำตอบที่ถูกต้อง: ${q.options[q.correct]}</div>` : ''}
                    <div class="explanation-list">
                        <strong>💡 คำอธิบายเพิ่มเติม:</strong>
                        ${expItemsHTML}
                    </div>
                `;

                expContainer.appendChild(reviewDiv);
            });
        }

        function restartQuiz() {
            currentQuestion = 0;
            userAnswers = new Array(quizData.length).fill(null);
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('question-box').classList.remove('hidden');
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
